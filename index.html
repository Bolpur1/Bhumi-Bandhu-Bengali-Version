<!-- QUERY FORM -->
<section id="query" class="query-section">
  <div class="container">

    <div class="heading">
      <small>অনলাইন কুয়েরি</small>
      <h2>আপনার জমির সমস্যার কথা জানান</h2>
      <p>
        নিচের ফর্মটি পূরণ করে WhatsApp-এর মাধ্যমে আপনার কুয়েরি পাঠান।
      </p>
    </div>

    <form id="queryForm" class="query-form">

      <div class="form-grid">

        <div class="form-group">
          <label for="name">নাম *</label>
          <input
            type="text"
            id="name"
            placeholder="আপনার নাম লিখুন"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">মোবাইল নম্বর *</label>
          <input
            type="tel"
            id="mobile"
            placeholder="১০ সংখ্যার মোবাইল নম্বর"
            maxlength="10"
            inputmode="numeric"
            required
          >
        </div>

        <div class="form-group">
          <label for="service">পরিষেবা নির্বাচন করুন *</label>
          <select id="service" required>
            <option value="">পরিষেবা নির্বাচন করুন</option>
            <option value="জমি রেজিস্ট্রেশন">জমি রেজিস্ট্রেশন</option>
            <option value="ভূমি রেকর্ড সহায়তা">ভূমি রেকর্ড সহায়তা</option>
            <option value="নামজারি সহায়তা">নামজারি সহায়তা</option>
            <option value="দলিল সংক্রান্ত সহায়তা">দলিল সংক্রান্ত সহায়তা</option>
            <option value="জমি কেনা-বেচা">জমি কেনা-বেচা</option>
            <option value="সম্পত্তি যাচাই">সম্পত্তি যাচাই</option>
            <option value="অন্যান্য">অন্যান্য</option>
          </select>
        </div>

        <div class="form-group">
          <label for="district">জেলা</label>
          <input
            type="text"
            id="district"
            placeholder="জেলার নাম"
          >
        </div>

        <div class="form-group">
          <label for="mouza">মৌজা</label>
          <input
            type="text"
            id="mouza"
            placeholder="মৌজার নাম"
          >
        </div>

        <div class="form-group">
          <label for="dag">দাগ নম্বর</label>
          <input
            type="text"
            id="dag"
            placeholder="দাগ নম্বর"
          >
        </div>

        <div class="form-group">
          <label for="khatian">খতিয়ান নম্বর</label>
          <input
            type="text"
            id="khatian"
            placeholder="খতিয়ান নম্বর"
          >
        </div>

        <div class="form-group full">
          <label for="details">সমস্যার বিস্তারিত *</label>
          <textarea
            id="details"
            rows="6"
            placeholder="আপনার জমি বা সম্পত্তি সংক্রান্ত সমস্যাটি বিস্তারিত লিখুন..."
            required
          ></textarea>
        </div>

      </div>

      <div class="query-submit-area">
        <button type="submit" class="btn query-submit">
          WhatsApp-এ কুয়েরি পাঠান →
        </button>

        <p class="form-note">
          আপনার তথ্য WhatsApp-এর মাধ্যমে আমাদের কাছে পাঠানো হবে।
        </p>
      </div>

    </form>

  </div>
</section>
